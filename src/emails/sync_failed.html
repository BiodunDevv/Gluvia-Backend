<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Failed Notification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #f44336;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 0 0 5px 5px;
        }
        .error-box {
            background-color: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚠️ Sync Failed</h1>
    </div>
    <div class="content">
        <p>Hello Admin,</p>
        
        <p>A sync operation has failed for the following user:</p>
        
        <div class="error-box">
            <strong>User:</strong> {{email}}<br>
            <strong>Error:</strong><br>
            <pre>{{errorMessage}}</pre>
        </div>
        
        <p>Please check the server logs for more details and investigate the issue.</p>
        
        <p>This is an automated alert from Gluvia AI system.</p>
    </div>
</body>
</html>
