<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New User Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #FF9800;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 0 0 5px 5px;
        }
        .info-box {
            background-color: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📢 New User Registered</h1>
    </div>
    <div class="content">
        <p>Hello Admin,</p>
        
        <p>A new user has registered on Gluvia AI platform.</p>
        
        <div class="info-box">
            <strong>User Details:</strong><br>
            <strong>Email:</strong> {{email}}<br>
            <strong>Registration Date:</strong> {{createdAt}}
        </div>
        
        <p>Please review the new user registration in the admin dashboard.</p>
        
        <p>This is an automated notification from Gluvia AI system.</p>
    </div>
</body>
</html>
